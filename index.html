<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Model UN Dashboard</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --present: #22c55e;
      --voting: #3b82f6;
      --absent: #ef4444;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      padding: 20px;
    }

    header {
      margin-bottom: 20px;
      text-align: center;
    }

    h1 {
      font-size: 2rem;
      color: var(--accent);
    }

    .container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      flex-grow: 1;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 20px;
      display: flex;
      flex-direction: column;
    }

    .card h2 {
      font-size: 1.25rem;
      margin-bottom: 15px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 8px;
    }

    /* General Speakers List - Big Flag Display */
    .speaker-display {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      background-color: rgba(0, 0, 0, 0.2);
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
      flex-grow: 1;
    }

    .flag-container {
      width: 100%;
      max-width: 320px;
      height: 200px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 15px;
      border-radius: 6px;
      overflow: hidden;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
      background-color: #000;
    }

    .flag-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .current-speaker-name {
      font-size: 2.2rem;
      font-weight: bold;
      color: #fff;
    }

    .speaker-subtext {
      color: var(--text-muted);
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* Roll Call Grid */
    .roll-call-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 12px;
      width: 100%;
      max-height: 500px;
      overflow-y: auto;
      padding-right: 5px;
    }

    .country-card {
      background-color: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      transition: transform 0.15s ease, border-color 0.15s ease;
    }

    .country-card:hover {
      transform: translateY(-2px);
      border-color: var(--accent);
    }

    .country-card img {
      width: 48px;
      height: 32px;
      object-fit: cover;
      border-radius: 3px;
      margin-bottom: 8px;
    }

    .country-card .name {
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 8px;
      word-break: break-word;
    }

    .status-btns {
      display: flex;
      gap: 4px;
      width: 100%;
    }

    .btn-status {
      flex: 1;
      border: none;
      padding: 4px 0;
      font-size: 0.7rem;
      border-radius: 3px;
      cursor: pointer;
      color: #fff;
      opacity: 0.4;
      transition: opacity 0.2s;
    }

    .btn-status.active {
      opacity: 1;
      font-weight: bold;
    }

    .btn-p { background-color: var(--present); }
    .btn-pv { background-color: var(--voting); }
    .btn-a { background-color: var(--absent); }

    /* Controls */
    .controls {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    button.action-btn {
      background-color: var(--accent);
      color: var(--bg-color);
      border: none;
      padding: 8px 16px;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
    }

    button.action-btn:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>

  <header>
    <h1>Model United Nations Committee Dashboard</h1>
  </header>

  <div class="container">
    <!-- General Speakers List Section -->
    <div class="card">
      <h2>General Speakers List</h2>
      <div class="speaker-display">
        <span class="speaker-subtext">Now Speaking</span>
        <div class="flag-container">
          <img id="current-flag" src="https://flagcdn.com/w320/un.png" alt="Country Flag">
        </div>
        <div id="current-speaker-name" class="current-speaker-name">No Speaker Selected</div>
      </div>
      <div class="controls">
        <button class="action-btn" onclick="nextSpeaker()">Next Speaker</button>
      </div>
    </div>

    <!-- Roll Call Section -->
    <div class="card">
      <h2>Roll Call & Attendance Grid</h2>
      <div id="roll-call-grid" class="roll-call-grid">
        <!-- Dynamically Generated Country Cards -->
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
